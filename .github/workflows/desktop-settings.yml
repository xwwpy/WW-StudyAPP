name: Windows settings and notification acceptance

on:
  push:
    branches: ['validation/settings-*']
  workflow_dispatch:
    inputs:
      test_scope:
        description: Partial scopes require valid prior evidence for unchanged regressions
        type: choice
        options:
          - full
          - notifications
          - settings
        default: full

permissions:
  contents: read

concurrency:
  group: settings-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  settings:
    name: Bounded desktop tests and native settings
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: desktop-windows-windows
          key: desktop-windows
          cache-on-failure: true
      - name: Record runner resources without changing storage or timeout policies
        run: |
          Write-Output "Logical processors: $([Environment]::ProcessorCount); Rust test threads: 2"
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object DeviceID, FreeSpace, Size
      - name: Check source formatting and user documentation
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Source formatting failed' }
          python scripts/check-user-docs.py
          if ($LASTEXITCODE -ne 0) { throw 'User documentation boundary failed' }
      - name: Verify selected regressions with bounded test concurrency
        env:
          TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
        run: |
          $testArgs = @('test', '--locked', '-p', 'studyapp-desktop')
          switch ($env:TEST_SCOPE) {
            'full' { $testArgs += @('--all-features', '-p', 'studyapp-ui') }
            'notifications' { $testArgs += @('--features', 'ui-test', '--bin', 'studyapp', 'native_notification') }
            'settings' { $testArgs += @('--features', 'ui-test', '--bin', 'studyapp', 'native_settings') }
            default { throw 'Unknown focused test scope' }
          }
          Write-Output "Executing test scope: $env:TEST_SCOPE"
          "Test scope: **$env:TEST_SCOPE**. Partial modes run affected regressions only with ui-test, matching the native build; this is not a full-suite receipt." >> $env:GITHUB_STEP_SUMMARY
          $testArgs += @('--', '--test-threads=2')
          cargo @testArgs
          if ($LASTEXITCODE -ne 0) { throw 'Selected bounded regressions failed' }
      - name: Build the affected native settings validation binary
        run: |
          cargo build --locked -p studyapp-desktop --features ui-test
          if ($LASTEXITCODE -ne 0) { throw 'Native settings validation build failed' }
      - name: Verify actual settings and notification routes
        run: |
          $settingsDir = Join-Path $env:RUNNER_TEMP ('studyapp-focused-settings-' + [guid]::NewGuid().ToString('N'))
          "SETTINGS_DIR=$settingsDir" >> $env:GITHUB_ENV
          ./scripts/smoke-settings.ps1 -DataDirectory $settingsDir -BinaryPath ./target/debug/studyapp.exe
      - name: Preserve focused native evidence
        if: always() && env.SETTINGS_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-settings-focused-${{ github.run_attempt }}
          path: |
            ${{ env.SETTINGS_DIR }}/settings-*
            ${{ env.SETTINGS_DIR }}/notification-*
            ${{ env.SETTINGS_DIR }}/native-*.json
            ${{ env.SETTINGS_DIR }}/native-*.bmp
            ${{ env.SETTINGS_DIR }}/*.log
            ${{ env.SETTINGS_DIR }}/smoke-input-mode.txt
          if-no-files-found: error
          retention-days: 14
