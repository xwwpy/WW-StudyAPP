name: NSIS package

# Dry run for the cargo-sweep style Windows packaging: build the portable
# payload, compile the NSIS setup with makensis, then wrap the installer and
# portable ZIPs with SHA256SUMS. Nothing is published from this workflow.

on:
  workflow_dispatch:
    inputs:
      acceptance_run:
        description: Optional existing package run; allowed only when production inputs are unchanged
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: ${{ inputs.acceptance_run == '' }}
    name: Build NSIS setup and wrapper assets
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true

      - name: Verify installer source contracts
        run: |
          python scripts/test-nsis-sources.py
          if ($LASTEXITCODE -ne 0) { throw 'NSIS source checks failed' }

      - name: Fetch locked dependencies
        # scripts/package.ps1 reads locked metadata with --all-features --offline,
        # which needs optional dependencies that a default-feature build omits.
        run: cargo fetch --locked

      - name: Build release application
        run: cargo build --release --locked --bin studyapp

      - name: Build portable payload
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Workspace version unavailable' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          ./scripts/package.ps1 -Version $version

      - name: Build NSIS setup
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path -LiteralPath $makensis)) { throw 'makensis is unavailable' }
          $payload = (Resolve-Path "dist/WW-StudyApp-$env:APP_VERSION-windows-x86_64").Path
          $icon = (Resolve-Path 'assets/icon.ico').Path
          $out = Join-Path (Get-Location) "dist/WW-StudyApp-$env:APP_VERSION-windows-x86_64-Setup.exe"
          & $makensis "/DVERSION=$env:APP_VERSION" "/DPAYLOAD=$payload" "/DICON=$icon" "/DOUTFILE=$out" installer/studyapp.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          if (-not (Test-Path -LiteralPath $out)) { throw 'Setup executable was not produced' }

      - name: Verify application and setup icons
        run: |
          python scripts/app-icon.py --exe target/release/studyapp.exe --installer "dist/WW-StudyApp-$env:APP_VERSION-windows-x86_64-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Application icon verification failed' }

      - name: Package installer and portable wrappers
        run: |
          ./scripts/package-release.ps1 -Version $env:APP_VERSION -SetupPath "dist/WW-StudyApp-$env:APP_VERSION-windows-x86_64-Setup.exe" -PayloadDirectory "dist/WW-StudyApp-$env:APP_VERSION-windows-x86_64" -OutputDirectory release
          Copy-Item -LiteralPath "dist/WW-StudyApp-$env:APP_VERSION-windows-x86_64-Setup.exe" -Destination release -Force

      - name: Upload NSIS package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-release-${{ github.run_attempt }}
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: NSIS install, upgrade and uninstall acceptance
    needs: package
    if: ${{ always() && !cancelled() && (needs.package.result == 'success' || inputs.acceptance_run != '') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate the package source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.acceptance_run }}
        run: |
          $sourceRun = $env:GITHUB_RUN_ID
          $attempt = $env:GITHUB_RUN_ATTEMPT
          if ($env:SOURCE_RUN) {
            if ($env:SOURCE_RUN -notmatch '^[1-9][0-9]*$') { throw 'Invalid package run ID' }
            $sourceRun = $env:SOURCE_RUN
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$sourceRun" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Package source run unavailable' }
            if ($run.status -ne 'completed' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.path -ne '.github/workflows/package-nsis.yml') { throw 'Untrusted package source' }
            $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$sourceRun/jobs?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Package source jobs unavailable' }
            if (@($jobs.jobs | Where-Object { $_.name -eq 'Build NSIS setup and wrapper assets' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'Package source did not build successfully' }
            git merge-base --is-ancestor $run.head_sha HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Package source is not an ancestor' }
            $allowed = @('scripts/test-nsis-install.ps1', 'scripts/nsis-directory-native.cs', 'scripts/test-nsis-sources.py', 'scripts/shortcut-reader.cs', '.github/workflows/package-nsis.yml')
            $changed = @(git diff --name-only $run.head_sha HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot compare package inputs' }
            if (@($changed | Where-Object { $_ -notin $allowed }).Count) { throw 'Production inputs changed; build a fresh package' }
            $oldWorkflow = (git show "$($run.head_sha):.github/workflows/package-nsis.yml") -join "`n"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read original package workflow' }
            $currentWorkflow = [IO.File]::ReadAllText('.github/workflows/package-nsis.yml').Replace("`r`n", "`n")
            function Get-PackageBuildContract([string]$workflow) {
              $prefix = ($workflow -split '  acceptance:', 2)[0]
              $inputBlock = @('    inputs:', '      acceptance_run:', '        description: Optional existing package run; allowed only when production inputs are unchanged', '        type: string', "        default: ''") -join "`n"
              $condition = '    if: ' + '$' + "{{ inputs.acceptance_run == '' }}" + "`n"
              # Only the explicitly added read permission, dispatch input and skip
              # condition are normalized; all build configuration must match.
              return $prefix.Replace($inputBlock + "`n", '').Replace("  actions: read`n", '').Replace($condition, '').TrimEnd()
            }
            if ((Get-PackageBuildContract $oldWorkflow) -cne (Get-PackageBuildContract $currentWorkflow)) { throw 'Package build configuration changed; build a fresh package' }
            $attempt = $run.run_attempt
          }
          "run=$sourceRun" >> $env:GITHUB_OUTPUT
          "artifact=nsis-release-$attempt" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: acceptance
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}

      - name: Run the NSIS lifecycle acceptance
        run: |
          $setup = Get-ChildItem -LiteralPath acceptance -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Setup asset missing from the package artifact' }
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Workspace version unavailable' }
          ./scripts/test-nsis-install.ps1 -SetupPath $setup.FullName -Version $version

      - name: Preserve installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-acceptance-${{ github.run_attempt }}
          path: .scratch/nsis-acceptance/
          if-no-files-found: ignore
