name: macOS approval diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/updates-013]
    paths:
      - scripts/macos-approval-ui.js
      - scripts/assess-macos-update.py
      - .github/workflows/macos-approval-diagnostic.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-approval-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Native scripting bridge and Settings read
        run: |
          mkdir "$RUNNER_TEMP/approval-diagnostic"
          osascript -l JavaScript scripts/macos-approval-ui.js bridge-self-test > "$RUNNER_TEMP/approval-diagnostic/bridge.json"
          open 'x-apple.systempreferences:com.apple.preference.security?Privacy'
          sleep 2
          osascript -l JavaScript scripts/macos-approval-ui.js snapshot 'System Settings' > "$RUNNER_TEMP/approval-diagnostic/settings.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostic-dmg-arm64-40931421699
          run-id: 40931421699
          github-token: ${{ github.token }}
          path: diagnostic-package
      - name: Replay system approval on retained diagnostic package
        run: |
          cd diagnostic-package
          shasum -a 256 --check *.sha256
          mkdir "$RUNNER_TEMP/diagnostic-mount" "$RUNNER_TEMP/diagnostic-installed"
          hdiutil attach *.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/diagnostic-mount"
          ditto "$RUNNER_TEMP/diagnostic-mount/WW-StudyApp.app" "$RUNNER_TEMP/diagnostic-installed/WW-StudyApp.app"
          hdiutil detach "$RUNNER_TEMP/diagnostic-mount"
          python3 "$GITHUB_WORKSPACE/scripts/assess-macos-update.py" --bundle "$RUNNER_TEMP/diagnostic-installed/WW-StudyApp.app" --package *.dmg --output "$RUNNER_TEMP/approval-diagnostic/assessment.json"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/approval-diagnostic/*.json
            ${{ runner.temp }}/approval-diagnostic/*.png
          retention-days: 3
