[package]
name = "studyapp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "studyapp"
path = "src/main.rs"

[features]
ui-test = [
    "gpui-kit/test-support",
    "studyapp-ui/ui-test",
    "windows/Win32_UI_TextServices",
    "windows/Win32_UI_Input_Ime",
    "windows/Win32_System_Com",
    "windows/Win32_System_Ole",
    "windows/Win32_System_Variant",
    "windows/Win32_System_LibraryLoader",
    "windows/Win32_System_Threading",
]

[dependencies]
wry = "=0.57.0"
studyapp-ui = { version = "0.1.2", path = "../studyapp-ui" }
studyapp-core = { version = "0.1.2", path = "../studyapp-core" }
studyapp-sync = { version = "0.1.2", path = "../studyapp-sync" }
anyhow = "1"
chrono = "0.4"
config = { version = "=0.15.27", default-features = false, features = ["json"] }
directories = "6"
gpui-kit = "=0.7.3"
pulldown-cmark = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
similar = "2"
zeroize = "1"
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11 = { version = "2", features = ["xlib"] }
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
